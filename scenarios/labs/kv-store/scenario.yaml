# Lab: System Design Interview vol. 1, ch. 6 — Key-value store (Dynamo-style).
# N=3 replicas, W=2, R=2 quorum, consistent hashing with virtual nodes, hinted handoff,
# vector clocks, gossip failure detection. One fault: a machine down for 3 minutes, which takes
# its sixteenth of the cluster's capacity while it lasts (README); hinted handoff, vector clocks
# and gossip are not modelled.
# A network partition, the fault that tells `mode: ap` from `cp`, is a phase 4 backlog item: not
# modelled, and the loader refuses `kind: partition`.
version: 1
name: lab-kv-store
seed: 1
duration: 30m
step: 100ms
warmup: 1m

datacenters:
  dc-a: {}

nodes:
  clients:
    type: client
    dc: dc-a
    rate: {base: 30k/s}
    ops: {get: 0.7, put: 0.3}
    keys: {zipf: 0.9, space: 100M}
    sizes: {put: 1KB}
    timeout: 100ms

  coordinator:
    type: service
    dc: dc-a
    replicas: 4
    capacity: 15k/s
    latency: 0.2ms
    ops:
      get: [{to: store, op: read}]
      put: [{to: store, op: write}]

  store:
    type: kv_cluster
    dc: dc-a
    # 16 nodes, not the book's 8. The coordinator sends every get and put to N = 3 replicas, so
    # the 30k requests/s are 90k replica-requests/s for the cluster, and each node of 10k/s
    # carries on average 90k / nodes:
    #   8 nodes   11.25k/s average (112.5 %); the hottest node of the ring carries
    #             1 + z_8/sqrt(3 x vnodes) = 1.068 x that = 12.01k/s (120 %): red, and the
    #             cluster drops 10k of its 90k replica-requests/s (a ninth), failing all three
    #             SLOs (drops, utilization, the put's p99: capped at the clients' 100 ms
    #             timeout, which more than half of the requests outlast). The lesson.
    #   16 nodes  5.625k/s average (56.25 %); the hottest 1.083 x that = 6.094k/s (60.9 %):
    #             green, no drops.
    # (z_M: the expected maximum of M standard normals, 1.43 for 8 nodes, 1.77 for 16.)
    # Try `nodes: 8` to see it, and `vnodes: 1` to see how much the ring's spread costs (and how
    # a quorum of two hides it from the p99).
    nodes: 16
    vnodes: 150
    replication: 3
    write_quorum: 2
    read_quorum: 2
    mode: ap                                    # try cp
    capacity: 10k/s                             # per node
    latency: 0.3ms

links:
  - {from: clients, to: coordinator, dir: inout}
  - {from: coordinator, to: store, dir: inout}

slo:
  - {metric: p99_latency, node: clients, op: put, max: 20ms}
  - {metric: utilization, node: store, max: 0.8}
  - {metric: drop_rate, max: 0.01}

faults:
  - {at: 10m, kind: node_down, node: store, replicas: 1, for: 3m}   # one of the nodes
