# Lab: System Design Interview vol. 1, ch. 5 — Consistent hashing.
# A load balancer hashes keys onto a ring of cache servers. The shipped `vnodes: 150` (even
# partitions) meets the SLOs; try `vnodes: 1` (uneven: the hottest server takes just over
# half the load and fails the cache servers' SLO; the database's still passes). The fault below
# (a server removed for 5 minutes) takes a quarter of the tier's capacity while it lasts (README).
version: 1
name: lab-consistent-hashing
seed: 1
duration: 20m
step: 100ms
warmup: 1m

nodes:
  clients:
    type: client
    rate: {base: 40k/s}
    ops: {get: 0.9, set: 0.1}
    keys: {zipf: 0.9, space: 10M}
    timeout: 200ms

  ring:
    type: load_balancer
    policy: consistent_hash
    vnodes: 150                                 # try 1: the hottest server at 137%
    capacity: 200k/s
    latency: 0.05ms

  cache_servers:
    type: cache
    replicas: 4
    eviction: lru
    keys: 2M                                    # per server: the ring splits the keys, 8M in total
    hit_ratio: che
    strategy: read_through                      # a miss reads db itself
    backend: db
    write_ops: [set]                            # a set updates the cache; only gets miss
    capacity: 15k/s                             # 40k/s over 4: 67% each, room for the hottest
    latency: 0.2ms

  db:
    type: sql_db
    replicas: 2
    capacity: 5k/s

links:
  - {from: clients, to: ring, dir: inout}
  - {from: ring, to: cache_servers, dir: inout}
  - {from: cache_servers, to: db, dir: inout}

slo:
  - {metric: utilization, node: cache_servers, max: 0.85}
  - {metric: utilization, node: db, max: 0.7}

faults:
  - {at: 10m, kind: node_down, node: cache_servers, replicas: 1, for: 5m}   # one of the four replicas
