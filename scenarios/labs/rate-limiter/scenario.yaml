# Lab: System Design Interview vol. 1, ch. 4 — Rate limiter.
# Compare algorithms under a bursty client. To try another one, edit `algorithm:` on the
# limiter (token_bucket, leaky_bucket, fixed_window, sliding_log or sliding_counter) and swap
# `burst` for `window` as the comment on the limiter explains, then `run` the file again.
# (`simsys sweep` ranges over numbers only, so an algorithm, a word, is edited by hand; the
# README sweeps the bucket's size.)
version: 1
name: lab-rate-limiter
seed: 1
duration: 30m
step: 100ms
warmup: 1m

nodes:
  clients:
    type: client
    rate:
      base: 800/s
      spikes:
        - {at: 5m, for: 30s, factor: 5}
        - {at: 15m, for: 2m, factor: 2}
        - {at: 25m, for: 5s, factor: 20}
    ops: {call: 1.0}
    timeout: 1s

  # To switch algorithm: token_bucket and leaky_bucket take `burst` (the bucket's size);
  # fixed_window, sliding_log and sliding_counter take `window` instead (e.g. `window: 1s`,
  # at most limit x window per window) and refuse a `burst`. A leaky_bucket also refuses
  # capacity, latency and advanced.queue_limit/concurrency: its queue IS the bucket.
  limiter:
    type: rate_limiter
    algorithm: token_bucket
    limit: 1k/s
    burst: 100
    backend: counters

  # The limiter's `counter` is ch. 4's Redis INCR, a write: the store must say so, or the graph
  # refuses it (a store would serve the increment as a read).
  counters: {type: cache, eviction: ttl, ttl: 1m, keys: 1M, hit_ratio: {fixed: 1.0}, write_ops: [counter], capacity: 100k/s, latency: 0.2ms}

  api:
    type: service
    replicas: 2
    capacity: 600/s
    latency: 2ms
    advanced: {queue_limit: 200}

links:
  - {from: clients, to: limiter, dir: inout}
  - {from: limiter, to: counters, dir: inout}
  - {from: limiter, to: api, dir: inout}

slo:
  - {metric: utilization, node: api, max: 0.9}
  - {metric: p99_latency, node: clients, op: call, max: 50ms}
