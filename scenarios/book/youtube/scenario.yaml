# System Design Interview vol. 1, ch. 14 — Video streaming (YouTube).
# Book numbers: 5M DAU, 5 videos watched/user/day, 10% upload one video/day, 300 MB
# average upload → ~290 streams/s, ~6 uploads/s, 150 TB/day of uploads. CDN serves
# streams; uploads go straight to blob storage via presigned URLs; transcoding is a DAG.
version: 1
name: youtube
seed: 1
duration: 24h
step: 100ms
warmup: 5m

datacenters:
  us-east: {}
  eu-west: {}

nodes:
  viewers_us:
    type: client
    dc: us-east
    rate:
      base: 200/s
      wave: {shape: sine, period: 24h, amplitude: 0.6, peak_at: 21:00}
    ops: {stream: 0.88, upload: 0.02, upload_meta: 0.02, metadata: 0.08}
    # Per request: 300 MB is the book's average upload (ch. 14). The book sizes no stream; 50 MB is
    # this scenario's choice (one rendition watched, smaller than the original), and so are the
    # 2 KB metadata requests.
    sizes: {stream: 50MB, upload: 300MB, upload_meta: 2KB, metadata: 2KB}
    keys: {zipf: 1.0, space: 10M}
    # Upload timeout. The book's uploads are resumable (ch. 14): the file goes up in chunks and a
    # client that gives up gives up on a chunk, retrying it, never on the whole file. The model has
    # one timeout per client, not one per chunk, so it is sized for the largest request: a 300 MB
    # upload is acknowledged at its last byte, about 12 s after its wait (300 MB at 40 ms per MB),
    # so 30 s is the chunk-level patience scaled up to the whole file. At 10 s every upload timed
    # out. Streams are judged by their own p99 SLO below, not by this timeout.
    timeout: 30s

  viewers_eu:
    type: client
    dc: eu-west
    rate:
      base: 100/s
      wave: {shape: sine, period: 24h, amplitude: 0.6, peak_at: 21:00}
    ops: {stream: 0.88, upload: 0.02, upload_meta: 0.02, metadata: 0.08}
    sizes: {stream: 50MB, upload: 300MB, upload_meta: 2KB, metadata: 2KB}
    keys: {zipf: 1.0, space: 10M}
    timeout: 30s                               # resumable uploads: see viewers_us

  # keys = videos held at the edge, objects not bytes (the capacity counts bytes): 100k × 50 MB ≈ 5 TB
  # of edge disk in the US, half that in the EU, in proportion to the two capacities.
  cdn_us: {type: cdn, dc: us-east, ttl: 24h, hit_ratio: che, keys: 100k, origin: transcoded_store, capacity: 100GB/s}
  cdn_eu: {type: cdn, dc: eu-west, ttl: 24h, hit_ratio: che, keys: 50k, origin: transcoded_store, capacity: 50GB/s}

  lb: {type: load_balancer, dc: us-east, policy: round_robin}

  api:
    type: service
    dc: us-east
    replicas: 6
    capacity: 2k/s
    latency: 1ms
    ops:
      metadata:
        - {to: metadata_cache, op: read}
        - {to: metadata_db, op: read, on: miss}
      upload_meta:                             # returns a presigned URL; bytes go to blob directly
        - {to: metadata_db, op: write}

  metadata_cache: {type: cache, dc: us-east, eviction: lru, keys: 5M, hit_ratio: che, strategy: cache_aside}
  metadata_db: {type: sql_db, dc: us-east, replicas: 3, capacity: 3k/s}

  original_store:                              # raw uploads (S3-like)
    type: blob_store
    dc: us-east
    capacity: 5GB/s
    # `upload` is a write: the store acknowledges it at its last byte (300 MB at 40 ms per MB:
    # 12 s after its wait), where a read is answered at its first megabyte. The default write op
    # is `write`, so the name is listed.
    write_ops: [upload]
    then: [{to: transcode_q, op: publish}]

  transcode_q: {type: message_queue, dc: us-east, partitions: 32}

  transcoders:                                 # DAG: inspect → encode (several resolutions) → thumbnails → watermark
    type: worker_pool
    dc: us-east
    consumes: transcode_q
    # 600 workers: 600 / 60 s = 10 videos/s, above the 9.6 uploads/s of the 21:00 peak (480
    # requests/s x 2 % uploads), so rho = 0.96 and nothing backs up. Erlang C(600, 0.96) = 0.229,
    # so a video waits 0.229 x 60 s / (600 x 0.04) = 0.57 s on average. At 400 (6.667/s) the
    # uploads outran the pool from 15:43 and transcode_q fell 2.66 h behind by midnight.
    workers: 600
    cost: 60s                                  # per 300 MB video
    then:
      # size: 50MB is chosen, not the book's: one rendition is the size of one stream (sizes.stream
      # above), since a stream is one rendition watched. The write renames the op, so the 300 MB
      # upload's size does not carry over and the byte-sized store needs this one.
      - {to: transcoded_store, op: write, factor: 4, size: 50MB}     # 4 output resolutions
      - {to: completion_q, op: publish}

  # 20 GB/s: at the 21:00 peak the store is read by the CDNs' misses (157.8 streams/s x 50 MB =
  # 7.891k MB/s) and written by the transcoders' renditions (9.6 videos/s x 4 x 50 MB = 1.92k MB/s),
  # 9.811k MB/s in all: 49.1 % of 20 GB/s, where the 10 GB/s it had were 98.1 %, red.
  transcoded_store: {type: blob_store, dc: us-east, capacity: 20GB/s}

  completion_q: {type: message_queue, dc: us-east, partitions: 4}
  completion_handler:
    type: worker_pool
    dc: us-east
    consumes: completion_q
    workers: 4
    cost: 5ms
    then:
      - {to: metadata_db, op: write}
      - {to: metadata_cache, op: write}

links:
  - {from: viewers_us, to: cdn_us, dir: inout, ops: [stream]}
  - {from: viewers_eu, to: cdn_eu, dir: inout, ops: [stream]}
  - {from: cdn_us, to: transcoded_store, dir: inout}
  # Cross-DC, 150 ms default. The European misses cross the Atlantic: 140.8 streams/s x (1 - 0.594)
  # x 50 MB = 2.856k MB/s at the 21:00 peak. A 40 Gbit/s (5 GB/s) pipe carries them at 57.1 %
  # (unbounded without `bandwidth`). The pipe is one M/D/1 queue that waits for whole objects, 10 ms
  # of wire for each 50 MB stream: 0.5 x 0.571 / 0.429 x 10 ms = 6.66 ms of wait, plus 0.2 ms for
  # the first megabyte, at the peak.
  - {from: cdn_eu, to: transcoded_store, dir: inout, bandwidth: 40Gbit/s}
  - {from: viewers_us, to: lb, dir: inout, ops: [metadata, upload_meta]}
  - {from: viewers_eu, to: lb, dir: inout, ops: [metadata, upload_meta]}
  - {from: lb, to: api, dir: inout}
  - {from: api, to: metadata_cache, dir: inout}
  - {from: api, to: metadata_db, dir: inout}
  - {from: viewers_us, to: original_store, ops: [upload]}     # presigned direct upload
  - {from: viewers_eu, to: original_store, ops: [upload]}
  - {from: original_store, to: transcode_q}
  - {from: transcode_q, to: transcoders}
  - {from: transcoders, to: transcoded_store}
  - {from: transcoders, to: completion_q}
  - {from: completion_q, to: completion_handler}
  - {from: completion_handler, to: metadata_db}
  - {from: completion_handler, to: metadata_cache}

slo:
  - {metric: p99_latency, node: viewers_eu, op: stream, max: 2s}
  - {metric: queue_lag, node: transcode_q, max: 30m}
  # over: 1h checks every hour of the day on its own: the whole-day mean is the quiet night's and
  # the busy evening's together, and could stay under 0.8 while the 21:00 hour is over it.
  - {metric: utilization, node: cdn_us, max: 0.8, over: 1h}
