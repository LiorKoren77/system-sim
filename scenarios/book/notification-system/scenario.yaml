# System Design Interview vol. 1, ch. 10 — Notification system.
# Book numbers: 10M mobile push, 1M SMS, 5M email per day. Here scaled 10x for a busier
# system (~1.9k/s average) with a marketing-blast spike.
#
# Sized for the day's peak, the 09:00 blast (20x the curve for 15 minutes: 27.93k
# notifications/s, `explain`'s peak, against 2.66k/s at the 18:00 crest of the wave). The front
# (notification_svc, user_db, fanout) is sized to serve the blast as it comes, at most about
# 70 % busy; the channels behind the queues are sized to drain it within their lag SLOs, which is
# what the queues are for (ch. 10: "decouple the components"). README.md has the arithmetic.
version: 1
name: notification-system
seed: 1
duration: 24h
step: 100ms
warmup: 2m

nodes:
  services:                                   # internal services that trigger notifications
    type: client
    rate:
      base: 1.9k/s
      wave: {shape: sine, period: 24h, amplitude: 0.4, peak_at: 18:00}
      spikes: [{at: 09:00, for: 15m, factor: 20}]       # marketing blast
    ops: {notify: 1.0}
    keys: {zipf: 0.8, space: 10M}             # the user notified, 10M ids after the book's 10M pushes/day; user_cache's hit ratio follows
    timeout: 5s

  lb: {type: load_balancer, policy: round_robin}

  # 27.93k/s over 8 x 5k/s = 69.8 % at the blast. The 4 replicas first shipped were offered 140 %:
  # they dropped a quarter of the blast, 3.65 % of the day, the worst drop rate of the file.
  notification_svc:
    type: service
    replicas: 8
    capacity: 5k/s
    latency: 1ms
    ops:
      notify:
        - {to: user_cache, op: read}
        - {to: user_db, op: read, on: miss}
        - {to: user_limiter, op: check}
        - {to: fanout, op: route}

  # Also user_limiter's counter store: its `counter` (an INCR, ch. 4) is a write, the cache's
  # only one; the notification service's `read`s are what the Che hit ratio is about.
  user_cache: {type: cache, eviction: lru, keys: 5M, hit_ratio: che, strategy: cache_aside, write_ops: [counter]}
  # The misses, 18.6 % of 27.93k/s = 5.184k reads/s, go to the read replicas: 3 of them (replicas 4
  # = the primary + 3) at 3k/s each, 57.6 % each. With 2 (one read replica) it was 173 %.
  user_db: {type: sql_db, replicas: 4, capacity: 3k/s}

  user_limiter:                               # per-user rate limit
    type: rate_limiter
    algorithm: sliding_counter
    limit: 100k/s                             # aggregate; per-user rules are in the backend
    backend: user_cache

  # Drops the 2 % duplicates and publishes the rest once per channel: 0.6 + 0.3 + 0.05 + 0.3 =
  # 1.25 channel messages per notification, and one log write. 2 x the type's 20k/s: 69.8 % at the
  # blast (one copy would be offered 140 %).
  fanout:
    type: notification_fanout
    replicas: 2
    dedup: 0.02
    channels: {ios: ios_q, android: android_q, sms: sms_q, email: email_q}
    then:
      - {to: ios_q, op: publish, factor: 0.6}
      - {to: android_q, op: publish, factor: 0.3}
      - {to: sms_q, op: publish, factor: 0.05}
      - {to: email_q, op: publish, factor: 0.3}
      - {to: log_db, op: write}

  ios_q:     {type: message_queue, partitions: 16}
  android_q: {type: message_queue, partitions: 16}
  sms_q:     {type: message_queue, partitions: 4}
  email_q:   {type: message_queue, partitions: 8}

  # Each pool retries a send its provider failed (or its quota shed) 3 times, 1 s apart (the
  # default `retry_after`); the 4th failure is a dead letter, not a drop. The two channels with a
  # lag SLO are sized to drain the blast within it: a 15-minute blast of λ messages/s into a pool
  # of capacity μ ends (λ/μ − 1) × 15 min behind, so a lag of at most L needs μ ≥ λ × 15/(15 + L).
  #   iOS: λ = 16.42k/s × 1.02 attempts, L = 5 min: μ ≥ 12.6k/s; 260 x 20 ms = 13k/s
  #   SMS: λ = 1.368k/s × 1.05 attempts, L = 10 min: μ ≥ 865/s; 45 x 50 ms = 900/s
  # Android and e-mail have no lag SLO: Android keeps its 50 x 20 ms = 2.5k/s, three times the
  # 18:00 crest (782/s); e-mail's 20 x 30 ms = 667/s did not keep up even with the crest and grows to
  # 60 (2k/s). The blast puts them 34 and 46 minutes behind at worst (README.md).
  ios_workers:     {type: worker_pool, consumes: ios_q, workers: 260, cost: 20ms, then: [{to: apns, op: send}], retries: 3}
  android_workers: {type: worker_pool, consumes: android_q, workers: 50, cost: 20ms, then: [{to: fcm, op: send}], retries: 3}
  sms_workers:     {type: worker_pool, consumes: sms_q, workers: 45, cost: 50ms, then: [{to: sms_provider, op: send}], retries: 3}
  email_workers:   {type: worker_pool, consumes: email_q, workers: 60, cost: 30ms, then: [{to: email_provider, op: send}], retries: 3}

  # The providers' quotas (the type's 1k/s by default) must stay above what their pool sends at
  # full speed, its workers / cost, or the quota sheds what the pool then retries: APNs 15k/s for
  # 13k/s, FCM 3k/s for 2.5k/s, the SMS gateway 1.2k/s for 900/s, the e-mail service 2.5k/s for 2k/s.
  apns:           {type: external_sink, capacity: 15k/s, latency: 150ms, failure_rate: 0.02}
  fcm:            {type: external_sink, capacity: 3k/s, latency: 150ms, failure_rate: 0.02}
  sms_provider:   {type: external_sink, capacity: 1.2k/s, latency: 500ms, failure_rate: 0.05}
  email_provider: {type: external_sink, capacity: 2.5k/s, latency: 300ms, failure_rate: 0.01}

  # The notification log: 27.37k writes/s at the blast, each to N = 2 replicas, 54.74k/s over
  # 3 machines of 30k/s (still under the type's 50k/s, "KV 50k QPS"). At the 20k/s first shipped the
  # ring's hottest machine was 96 % at the blast, red.
  log_db: {type: kv_cluster, nodes: 3, replication: 2, write_quorum: 1, read_quorum: 1, capacity: 30k/s}

links:
  - {from: services, to: lb, dir: inout}
  - {from: lb, to: notification_svc, dir: inout}
  - {from: notification_svc, to: user_cache, dir: inout}
  - {from: notification_svc, to: user_db, dir: inout}
  - {from: notification_svc, to: user_limiter, dir: inout}
  - {from: user_limiter, to: user_cache, dir: inout}
  - {from: notification_svc, to: fanout}
  - {from: fanout, to: ios_q}
  - {from: fanout, to: android_q}
  - {from: fanout, to: sms_q}
  - {from: fanout, to: email_q}
  - {from: fanout, to: log_db}
  - {from: ios_q, to: ios_workers}
  - {from: android_q, to: android_workers}
  - {from: sms_q, to: sms_workers}
  - {from: email_q, to: email_workers}
  - {from: ios_workers, to: apns, dir: inout}
  - {from: android_workers, to: fcm, dir: inout}
  - {from: sms_workers, to: sms_provider, dir: inout}
  - {from: email_workers, to: email_provider, dir: inout}

slo:
  - {metric: queue_lag, node: ios_q, max: 5m}
  - {metric: queue_lag, node: sms_q, max: 10m}
  - {metric: drop_rate, max: 0.001}
