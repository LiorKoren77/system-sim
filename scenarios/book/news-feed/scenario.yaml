# System Design Interview vol. 1, ch. 11 — News feed.
# Book design: fan-out on write for ordinary users (pre-compute feeds into a cache),
# fan-out on read for celebrities. 10M DAU, each user posts a few times a day and reads
# the feed many times. Average 300 friends → each post fans out to ~300 feed caches.
version: 1
name: news-feed
seed: 1
duration: 24h
step: 100ms
warmup: 5m

datacenters:
  us-east: {}

nodes:
  users:
    type: client
    dc: us-east
    rate:
      base: 10k/s
      wave: {shape: sine, period: 24h, amplitude: 0.6, peak_at: 20:00}
      spikes: [{at: 12:00, for: 10m, factor: 3}]
    ops: {read_feed: 0.6, read_media: 0.3, post: 0.1}
    keys: {zipf: 1.1, space: 50M}
    sizes: {post: 2KB, read_media: 200KB}
    timeout: 500ms

  cdn: {type: cdn, dc: us-east, ttl: 1h, hit_ratio: {fixed: 0.95}, origin: media_store}
  media_store: {type: blob_store, capacity: 1GB/s}

  lb: {type: load_balancer, dc: us-east, policy: least_connections}

  # Sized for the day's peak, the 12:00 spike (3x the curve for 10 minutes: 21.6k/s, more than
  # 20:00's 16k/s), as every number below, by one rule: the smallest count whose peak is at most
  # two-thirds of its capacity (capacity 1.5x the peak: room for noise and bursts the smooth sine
  # lacks). Stateless web tier scaled out (ch. 1 "stateless web tier"; ch. 11 "web servers"): the
  # feed reads and posts, 70 % of 21.6k/s = 15.13k/s (media goes to the CDN), over 12 x 2k/s (the
  # back-of-the-envelope "web 2k QPS") = 63 %. 11 would be 68.8 %, over two-thirds (it still
  # passes every SLO, less than a point from yellow's 70 %). At 8 replicas it was 94.6 %, red.
  web:
    type: service
    dc: us-east
    replicas: 12
    capacity: 2k/s
    latency: 0.5ms
    ops:
      read_feed:
        - {to: feed_cache, op: read}                    # list of post ids for this user
        - {to: post_cache, op: read, factor: 20}        # hydrate ~20 posts
        - {to: post_db, op: read, on: miss}
        - {to: user_cache, op: read, factor: 20}
      post:
        - {to: post_db, op: write}
        - {to: post_cache, op: write}
        - {to: fanout_q, op: publish}

  # Fan-out on write (ch. 11 "fanout service") multiplies every post by the ~300 friends whose
  # feed it is written into: at the peak 2.162k posts/s x 300 = 648.6k writes/s, plus 12.97k feed
  # reads/s, 661.5k/s in all, over 10 replicas x 100k/s (the "cache 100k QPS" line) = 66.2 %. One
  # replica, as first shipped, was offered 662 %; 9 would be 73.5 %. This is the chapter's lesson in
  # one number: the feed cache is sized by the writes the fan-out makes, not by the reads.
  feed_cache: {type: cache, replicas: 10, eviction: lru, keys: 10M, hit_ratio: che, strategy: cache_aside}
  # A fixed ratio, not che: Che reads the key distribution of the client whose requests reach the
  # cache, and `users.keys` describes user ids (whose feed is read), not the post ids this cache
  # holds; with 50M slots over that 50M-key space Che would say h = 1. One client key space
  # cannot describe two kinds of id; che needs a client whose `keys` are the cached keys (a
  # client of posts). 0.95 is chosen, not the book's: a feed shows mostly recent posts, the ones
  # an LRU post cache keeps.
  #
  # The read path hydrates ~20 posts and their 20 authors per feed read (ch. 11 "newsfeed
  # retrieval"): 12.97k reads/s x 20 = 259.4k/s at each of post_cache and user_cache (post_cache
  # also takes the 2.162k post writes: 261.6k/s). 4 replicas x 100k/s: 65.4 % and 64.9 %. With 3
  # they would be at 87 %, a step from red, and the spike is exactly when a cache must not drop.
  post_cache: {type: cache, replicas: 4, eviction: lru, keys: 50M, hit_ratio: {fixed: 0.95}, strategy: cache_aside}
  user_cache: {type: cache, replicas: 4, eviction: lru, keys: 10M, hit_ratio: {fixed: 0.98}, strategy: cache_aside}

  # Writes at the peak: 2.162k posts/s x cost 5 = 10.81k units/s, where one primary commits 5k
  # units/s (spec §6: 1k writes/s), and every read replica replays every write of its shard, so
  # replicas cannot help (as in the URL shortener, ch. 8). The data is sharded (ch. 1 "sharding"):
  # 6 shards, each a primary + 2 read replicas. Per copy at the peak: primary 10.81k / 6 = 1.802k
  # units/s (36 %); replica the post_cache misses, 5 % x 259.4k = 12.97k reads/s over 12 replicas,
  # + 1.802k replayed = 2.883k units/s (57.7 %). With 5 shards a replica would be at 69.2 %, over
  # two-thirds (it still passes every SLO, less than a point from yellow's 70 %), with 4 at 86.5 %,
  # with 3 at 115 %, red.
  post_db:
    type: sql_db
    replicas: 3                                          # 1 primary + 2 read replicas per shard
    shards: 6
    replication_lag: 50ms
    capacity: 5k/s
    advanced: {queue_limit: 500, service_variability: 1.5}

  # partitions are printed, not modelled: in Kafka the 32 workers below would read as 16 consumers
  # (README "What it abstracts away"; 16 workers still keep the spike's lag at 101 us).
  fanout_q: {type: message_queue, partitions: 16}

  fanout:
    type: worker_pool
    consumes: fanout_q
    workers: 32
    cost: 5ms
    then:
      - {to: graph_db, op: read}                        # friend list
      - {to: feed_cache, op: write, factor: 300}        # one write per friend

  graph_db: {type: kv_cluster, nodes: 6, replication: 3, write_quorum: 2, read_quorum: 2, capacity: 30k/s}

links:
  - {from: users, to: cdn, dir: inout, ops: [read_media]}
  - {from: cdn, to: media_store, dir: inout}
  - {from: users, to: lb, dir: inout, ops: [read_feed, post]}
  - {from: lb, to: web, dir: inout}
  - {from: web, to: feed_cache, dir: inout, latency: 0.3ms}
  - {from: web, to: post_cache, dir: inout, latency: 0.3ms}
  - {from: web, to: user_cache, dir: inout, latency: 0.3ms}
  - {from: web, to: post_db, dir: inout}
  - {from: web, to: fanout_q}
  - {from: fanout_q, to: fanout}
  - {from: fanout, to: graph_db, dir: inout}
  - {from: fanout, to: feed_cache}

slo:
  - {metric: p99_latency, node: users, op: read_feed, max: 200ms}
  - {metric: drop_rate, max: 0.001}
  - {metric: queue_lag, node: fanout_q, max: 2m}

# Every copy of post_db down for 30 s at 15:00: what it costs is in the README ("The 15:00
# outage"). Delete the entry to see the day as sized.
faults:
  - {at: 15:00, kind: node_down, node: post_db, for: 30s}
