# System Design Interview vol. 1, ch. 8 — URL shortener.
# Book numbers: 100M URLs/day written (~1,160/s), read:write 10:1 (~11,600/s reads),
# 365B records over 10 years, 7-char base-62 short URLs.
# Sized with the book's remedies, not by loosening the SLOs (see README): a stateless web tier
# scaled out, a cache absorbing the reads, and the database sharded.
version: 1
name: url-shortener
seed: 1
duration: 24h
# 1 s steps: the fluid step is exact while demand is constant within it, and the daily sine moves
# by at most 0.003 % of its peak in a second; the day's figures match a 100 ms run to 1.1e-8 and
# the worst hour's utilization to 1.3e-6 (README, "What the model captures"), at a tenth of the
# steps (86,280 observed after the warmup instead of 862,800).
step: 1s
warmup: 2m

nodes:
  users:
    type: client
    rate:
      base: 12.8k/s                          # 11.6k reads + 1.16k writes
      wave: {shape: sine, period: 24h, amplitude: 0.5, peak_at: 14:00}
    ops: {redirect: 0.91, shorten: 0.09}
    keys: {zipf: 1.0, space: 100M}           # a few short links get most of the clicks
    timeout: 1s

  # 20k/s sits just above the 19.2k/s peak and below the web tier's 24k/s: legitimate traffic
  # passes, and a flood is refused here before it can push the web tier into red.
  limiter:
    type: rate_limiter
    algorithm: token_bucket
    limit: 20k/s
    burst: 2000
    backend: rules_cache

  # The limiter's rules and counters: 10k keys fit in memory whole, so every lookup hits. The
  # limiter's `counter` is an INCR (ch. 4), a write, so it is the cache's write op.
  rules_cache: {type: cache, eviction: lru, keys: 10k, hit_ratio: {fixed: 1.0}, strategy: cache_aside, write_ops: [counter]}

  lb: {type: load_balancer, policy: round_robin}

  # Stateless web tier scaled out (ch. 1, "stateless web tier"; ch. 8 wrap-up): 19.2k/s at the
  # 14:00 peak (12.8k/s x 1.5) over 8 x 3k/s = 80 %, yellow. 7 replicas would be 91 %, red.
  web:
    type: service
    replicas: 8
    capacity: 3k/s
    latency: 0.3ms
    ops:
      redirect: [{to: url_cache, op: read}, {to: url_db, op: read, on: miss}]
      shorten:  [{to: id_gen, op: next_id}, {to: url_db, op: write}]

  id_gen: {type: id_generator, algorithm: snowflake, replicas: 2}

  url_cache:
    type: cache
    eviction: lru
    strategy: cache_aside
    keys: 20M                                # 20 % of the key space; Che/LRU gives h ≈ 0.88
    hit_ratio: che

  # Writes at the peak: 9 % of 19.2k/s = 1.728k/s, x cost 5 = 8.64k units/s, where one primary
  # commits 5k units/s (spec §6: 1k writes/s). Read replicas do not help: each one replays every
  # write of its shard. So the data is sharded (ch. 1 "sharding", ch. 8 wrap-up; 365B rows over
  # 10 years would not fit one box anyway): 3 shards, each a primary + 2 read replicas. Per copy
  # at the peak: primary 8.64k/3 = 2.88k units/s (58 %), replica 2.08k reads/6 + 2.88k = 3.23k
  # units/s (65 %). With 2 shards the replicas would be at 97 %, red.
  url_db:
    type: sql_db
    replicas: 3                              # 1 primary + 2 read replicas per shard
    shards: 3
    capacity: 5k/s
    replication_lag: 50ms
    advanced: {queue_limit: 1000}

links:
  - {from: users, to: limiter, dir: inout}
  - {from: limiter, to: rules_cache, dir: inout}
  - {from: limiter, to: lb, dir: inout}
  - {from: lb, to: web, dir: inout}
  - {from: web, to: url_cache, dir: inout}
  - {from: web, to: url_db, dir: inout}
  - {from: web, to: id_gen, dir: inout}

slo:
  - {metric: p99_latency, node: users, op: redirect, max: 50ms}
  - {metric: drop_rate, max: 0.001}
  # The hour the whole-day SLOs cannot see: url_db's busiest copy averages
  # 0.43 over the day but 0.6433 in its worst hour (13:02-14:02, around the 14:00 peak). Checked
  # per hour, a design whose peak hour runs the database hot fails here (`shards: 2`: 0.965)
  # while its day-long numbers still pass.
  - {metric: utilization, node: url_db, max: 0.9, over: 1h}
