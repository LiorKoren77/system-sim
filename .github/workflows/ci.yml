name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:   # a "Run workflow" button on the Actions tab (and `gh workflow run ci`)
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Ninja
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: Configure
        run: cmake --preset gcc14-debug
      - name: Build
        run: cmake --build --preset gcc14-debug
      - name: Test
        run: ctest --preset gcc14-debug
  # The Release preset (-O3) hits GCC 14.2 optimiser bugs that Debug never does (an
  # internal compiler error in ipa_comdats; undefined references to special members that
  # importers of simsys.model never emit, see CMakeLists.txt and src/model/model.cpp), so it
  # is built and tested too.
  build-test-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Ninja
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: Configure
        run: cmake --preset gcc14-release
      - name: Build
        run: cmake --build --preset gcc14-release
      - name: Test
        run: ctest --preset gcc14-release
      # The web job's fixture check and the precompute's integration test run this binary.
      - uses: actions/upload-artifact@v4
        with:
          name: simsys-release
          path: build/gcc14-release/simsys
          retention-days: 1
  # Sanitizers (docs/study/sanitizers.md): the compiler instruments the code and a run stops at the
  # first memory error (ASan), undefined behaviour (UBSan) or data race (TSan) a test reaches. TSan
  # cannot share a binary with ASan, hence two jobs; UBSan rides with ASan.
  build-test-asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # a hang fails here, not at GitHub's 6 h
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Ninja
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
      - name: Configure
        run: cmake --preset gcc14-asan
      - name: Build
        run: cmake --build --preset gcc14-asan
      - name: Test
        run: ctest --preset gcc14-asan
  # TSan runs only the tests that start threads (the preset's filter: `simsys sweep` and
  # `run --replications`, from the CLI and the unit tests): it finds nothing in single-threaded code.
  build-test-tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60   # a hang fails here, not at GitHub's 6 h
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Ninja
        run: sudo apt-get update && sudo apt-get install -y gcc-14 g++-14 ninja-build
      # GCC 14's TSan runtime assumes at most 28 bits of mmap randomisation; Ubuntu 24.04's kernel
      # uses 32, and every instrumented binary then dies at start ("unexpected memory mapping").
      - name: Lower mmap randomisation for TSan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: cmake --preset gcc14-tsan
      - name: Build
        run: cmake --build --preset gcc14-tsan
      - name: Test
        run: ctest --preset gcc14-tsan
  # The same tests built by Clang (CLAUDE.md §3): the oldest Clang the project supports, over GCC's
  # standard library, and Clang 20 over LLVM's own (libc++), the library a WebAssembly build
  # (Emscripten) uses. Each one has found what GCC accepts and the standard does not promise.
  build-test-clang:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: clang19-debug
            packages: gcc-14 g++-14 clang-19 clang-tools-19
          - preset: clang20-libcxx-debug
            packages: clang-20 clang-tools-20 libc++-20-dev libc++abi-20-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install ${{ matrix.preset }}'s toolchain and Ninja
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} ninja-build
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: find src tests \( -name '*.cpp' -o -name '*.cppm' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run -Werror
  # The web app (phase 5b, web/): the TypeScript type-checks, lints, is formatted, passes its tests
  # and builds. Node 22 LTS, the version the project develops with; `npm ci` installs exactly the
  # versions web/package-lock.json pins.
  web:
    runs-on: ubuntu-24.04
    needs: build-test-release
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check, lint, format
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      # The committed fixtures are still what simsys writes, and the precompute works through the
      # real binary: a change of simsys's output cannot leave the web code testing an old contract.
      - uses: actions/download-artifact@v4
        with:
          name: simsys-release
          path: ${{ github.workspace }}/simsys-bin
      - name: Fixtures are current
        run: |
          chmod +x "$GITHUB_WORKSPACE/simsys-bin/simsys"
          SIMSYS="$GITHUB_WORKSPACE/simsys-bin/simsys" npm run fixtures -- --check
      - name: Precompute through simsys
        run: SIMSYS="$GITHUB_WORKSPACE/simsys-bin/simsys" npx vitest run --project precompute
